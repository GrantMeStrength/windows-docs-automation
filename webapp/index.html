<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Documentation Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step { opacity: 0.4; transition: opacity 0.3s; }
        .step.active { opacity: 1; }
        .step.complete { opacity: 1; color: #10b981; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">Windows Documentation Generator</h1>
                    <p class="mt-1 text-sm text-gray-500">Create comprehensive docs in ~8 minutes</p>
                </div>
                <div class="text-right">
                    <div class="text-sm font-medium text-gray-500">Demo Mode</div>
                    <div class="text-xs text-gray-400">Mock AI responses</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Progress Steps -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div class="step active" id="step-intake">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">1</div>
                        <span class="ml-3 text-sm font-medium">Input</span>
                    </div>
                </div>
                <div class="flex-1 h-0.5 bg-gray-300 mx-4"></div>
                <div class="step" id="step-plan">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gray-300 text-white flex items-center justify-center font-bold">2</div>
                        <span class="ml-3 text-sm font-medium">Plan</span>
                    </div>
                </div>
                <div class="flex-1 h-0.5 bg-gray-300 mx-4"></div>
                <div class="step" id="step-generate">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gray-300 text-white flex items-center justify-center font-bold">3</div>
                        <span class="ml-3 text-sm font-medium">Generate</span>
                    </div>
                </div>
                <div class="flex-1 h-0.5 bg-gray-300 mx-4"></div>
                <div class="step" id="step-validate">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gray-300 text-white flex items-center justify-center font-bold">4</div>
                        <span class="ml-3 text-sm font-medium">Validate</span>
                    </div>
                </div>
                <div class="flex-1 h-0.5 bg-gray-300 mx-4"></div>
                <div class="step" id="step-publish">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full bg-gray-300 text-white flex items-center justify-center font-bold">5</div>
                        <span class="ml-3 text-sm font-medium">Publish</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div id="content">
            <!-- Intake Form (Step 1) -->
            <div id="intake-form" class="bg-white rounded-lg shadow p-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Create Windows Documentation</h2>
                
                <form id="docForm" class="space-y-6">
                    <!-- Feature Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Feature Name *</label>
                        <input type="text" name="featureName" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="e.g., Window Snapping API">
                    </div>

                    <!-- Content Type -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Content Type *</label>
                        <select name="contentType" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Select...</option>
                            <option value="new_feature">New Feature (complete documentation set)</option>
                            <option value="api_update">API Update (reference docs only)</option>
                            <option value="tutorial">Tutorial (step-by-step guide)</option>
                            <option value="migration_guide">Migration Guide (old to new)</option>
                        </select>
                    </div>

                    <!-- Target Audience -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Target Audience *</label>
                        <select name="targetAudience" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Select...</option>
                            <option value="beginner">Beginner (new to Windows development)</option>
                            <option value="intermediate">Intermediate (familiar with Windows)</option>
                            <option value="advanced">Advanced (expert developers)</option>
                        </select>
                    </div>

                    <!-- Release Version -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Release Version *</label>
                        <input type="text" name="releaseVersion" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="e.g., Windows App SDK 2.0">
                    </div>

                    <!-- Spec Doc URL -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Specification Document URL *</label>
                        <input type="url" name="specUrl" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="https://github.com/microsoft/WindowsAppSDK/blob/main/specs/...">
                        <p class="mt-1 text-sm text-gray-500">Link to feature specification or header file</p>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4">
                        <button type="submit" 
                                class="w-full bg-blue-600 text-white px-6 py-3 rounded-md font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition">
                            Generate Documentation Plan →
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('docForm');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            await runWorkflow(data);
        });

        async function runWorkflow(data) {
            // Step 1: Show planning
            showPlanning(data);
        }

        function showPlanning(data) {
            const content = document.getElementById('content');
            updateStep('step-plan');
            
            content.innerHTML = `
                <div class="bg-white rounded-lg shadow p-8">
                    <div class="flex items-center mb-6">
                        <svg class="spinner w-8 h-8 text-blue-600 mr-3" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <h2 class="text-2xl font-bold text-gray-900">Analyzing specification document...</h2>
                    </div>
                    <p class="text-gray-600">This usually takes about 30 seconds</p>
                </div>
            `;

            // Simulate AI planning
            setTimeout(() => showPlan(data), 2000);
        }

        function showPlan(data) {
            const content = document.getElementById('content');
            updateStep('step-plan', true);
            
            content.innerHTML = `
                <div class="bg-white rounded-lg shadow p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">📋 Documentation Plan for ${data.featureName}</h2>
                    
                    <div class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-md">
                        <p class="text-sm text-blue-800"><strong>AI Analysis Complete!</strong> Based on your specification, here's what I'll create:</p>
                    </div>

                    <div class="space-y-6">
                        <div>
                            <h3 class="text-lg font-semibold mb-3">Content to Create:</h3>
                            <ul class="space-y-2">
                                <li class="flex items-start">
                                    <svg class="w-5 h-5 text-green-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                    </svg>
                                    <span><strong>Overview Page</strong> (800 words) - Feature introduction and key concepts</span>
                                </li>
                                <li class="flex items-start">
                                    <svg class="w-5 h-5 text-green-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                    </svg>
                                    <span><strong>Getting Started Guide</strong> (1200 words) - Prerequisites and first steps</span>
                                </li>
                                <li class="flex items-start">
                                    <svg class="w-5 h-5 text-green-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                    </svg>
                                    <span><strong>How-to Guide</strong> (1500 words) - Common scenarios and tasks</span>
                                </li>
                                <li class="flex items-start">
                                    <svg class="w-5 h-5 text-green-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                    </svg>
                                    <span><strong>API Reference</strong> - 6 classes, 18 methods documented</span>
                                </li>
                                <li class="flex items-start">
                                    <svg class="w-5 h-5 text-green-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                                    </svg>
                                    <span><strong>Code Samples</strong> - 4 samples (C#, C++) with comments</span>
                                </li>
                            </ul>
                        </div>

                        <div class="border-t pt-4">
                            <h3 class="text-lg font-semibold mb-3">Scope Estimate:</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-2xl font-bold text-blue-600">10</div>
                                    <div class="text-sm text-gray-600">Total Files</div>
                                </div>
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-2xl font-bold text-blue-600">~5,500</div>
                                    <div class="text-sm text-gray-600">Words Generated</div>
                                </div>
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-2xl font-bold text-green-600">8 min</div>
                                    <div class="text-sm text-gray-600">Generation Time</div>
                                </div>
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-2xl font-bold text-red-600 line-through">8 hr</div>
                                    <div class="text-sm text-gray-600">Manual Effort</div>
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-4 pt-6">
                            <button onclick="startGeneration('${data.featureName}')" 
                                    class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-md font-medium hover:bg-blue-700 transition">
                                ✓ Approve & Generate
                            </button>
                            <button onclick="location.reload()" 
                                    class="px-6 py-3 border border-gray-300 rounded-md font-medium hover:bg-gray-50 transition">
                                ← Start Over
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function startGeneration(featureName) {
            const content = document.getElementById('content');
            updateStep('step-generate');
            
            content.innerHTML = `
                <div class="bg-white rounded-lg shadow p-8">
                    <div class="flex items-center mb-6">
                        <svg class="spinner w-8 h-8 text-blue-600 mr-3" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <h2 class="text-2xl font-bold text-gray-900">⚙️  Generating documentation...</h2>
                    </div>
                    
                    <div class="space-y-3">
                        <div id="gen-progress" class="space-y-2"></div>
                    </div>
                    
                    <div class="mt-6 p-4 bg-blue-50 rounded">
                        <p class="text-sm text-blue-800">This process typically takes 3-5 minutes. The AI is:</p>
                        <ul class="mt-2 text-sm text-blue-700 space-y-1">
                            <li>• Loading editorial standards and examples</li>
                            <li>• Generating content following Windows voice guidelines</li>
                            <li>• Creating and compiling code samples</li>
                            <li>• Validating all links and cross-references</li>
                        </ul>
                    </div>
                </div>
            `;

            simulateGeneration(featureName);
        }

        async function simulateGeneration(featureName) {
            const progress = document.getElementById('gen-progress');
            const steps = [
                '✅ Created: overview.md',
                '✅ Created: getting-started.md',
                '✅ Created: how-to-guide.md',
                '✅ Created: api/FeatureManager.md',
                '✅ Created: api/FeatureConfig.md',
                '✅ Created: api/FeatureState.md',
                '✅ Created: samples/basic-example.cs',
                '✅ Created: samples/advanced-example.cs',
                '⚙️  Validating metadata...',
                '⚙️  Compiling code samples...',
                '✅ All code samples compile successfully',
                '⚙️  Validating links...',
                '✅ All links validated'
            ];

            for (let i = 0; i < steps.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 500));
                const div = document.createElement('div');
                div.className = 'text-sm text-gray-700';
                div.textContent = steps[i];
                progress.appendChild(div);
                progress.scrollTop = progress.scrollHeight;
            }

            await new Promise(resolve => setTimeout(resolve, 1000));
            showValidation(featureName);
        }

        function showValidation(featureName) {
            const content = document.getElementById('content');
            updateStep('step-validate', true);
            
            content.innerHTML = `
                <div class="bg-white rounded-lg shadow p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">📊 Quality Validation Report</h2>
                    
                    <div class="mb-6 p-6 bg-gradient-to-r from-green-50 to-blue-50 border border-green-200 rounded-lg">
                        <div class="flex items-center justify-between">
                            <div>
                                <div class="text-sm text-gray-600">Overall Quality Score</div>
                                <div class="text-4xl font-bold text-green-600">87%</div>
                                <div class="text-sm text-green-700 font-medium">Good Quality</div>
                            </div>
                            <svg class="w-20 h-20 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                            </svg>
                        </div>
                    </div>

                    <div class="space-y-4 mb-6">
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded">
                            <span class="font-medium">✅ Metadata Complete</span>
                            <span class="text-green-600">100%</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded">
                            <span class="font-medium">✅ Code Samples Compile</span>
                            <span class="text-green-600">100%</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded">
                            <span class="font-medium">✅ Links Validated</span>
                            <span class="text-green-600">100%</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded">
                            <span class="font-medium">✅ API Documentation Complete</span>
                            <span class="text-green-600">95%</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded">
                            <span class="font-medium">⚠️ Accessibility Notes</span>
                            <span class="text-yellow-600">80%</span>
                        </div>
                    </div>

                    <div class="mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded">
                        <h3 class="font-semibold text-yellow-900 mb-2">💡 Suggestions (3)</h3>
                        <ul class="text-sm text-yellow-800 space-y-1">
                            <li>• Consider adding accessibility guidance to the overview</li>
                            <li>• Add keyboard navigation details to the how-to guide</li>
                            <li>• Include troubleshooting section for common errors</li>
                        </ul>
                    </div>

                    <div class="border-t pt-6">
                        <h3 class="font-semibold mb-3">Generated Files (10):</h3>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="p-2 bg-gray-50 rounded font-mono">docs/overview.md</div>
                            <div class="p-2 bg-gray-50 rounded font-mono">docs/getting-started.md</div>
                            <div class="p-2 bg-gray-50 rounded font-mono">docs/how-to-guide.md</div>
                            <div class="p-2 bg-gray-50 rounded font-mono">api/FeatureManager.md</div>
                            <div class="p-2 bg-gray-50 rounded font-mono">api/FeatureConfig.md</div>
                            <div class="p-2 bg-gray-50 rounded font-mono">api/FeatureState.md</div>
                            <div class="p-2 bg-gray-50 rounded font-mono">samples/basic.cs</div>
                            <div class="p-2 bg-gray-50 rounded font-mono">samples/advanced.cs</div>
                            <div class="p-2 bg-gray-50 rounded font-mono">samples/basic.cpp</div>
                            <div class="p-2 bg-gray-50 rounded font-mono">samples/advanced.cpp</div>
                        </div>
                    </div>

                    <div class="flex gap-4 pt-6">
                        <button onclick="showPreview('${featureName}')" 
                                class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-md font-medium hover:bg-blue-700 transition">
                            👁️ Preview Content
                        </button>
                        <button onclick="createPR('${featureName}')" 
                                class="flex-1 bg-green-600 text-white px-6 py-3 rounded-md font-medium hover:bg-green-700 transition">
                                ✓ Create Pull Request
                        </button>
                    </div>
                </div>
            `;
        }

        function showPreview(featureName) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="bg-white rounded-lg shadow p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">👁️ Content Preview: ${featureName}</h2>
                    
                    <div class="mb-4">
                        <select id="fileSelector" class="px-4 py-2 border rounded" onchange="updatePreview()">
                            <option value="overview">overview.md</option>
                            <option value="getting-started">getting-started.md</option>
                            <option value="api">api/FeatureManager.md</option>
                            <option value="sample">samples/basic.cs</option>
                        </select>
                    </div>

                    <div id="previewContent" class="border rounded p-6 bg-gray-50 max-h-96 overflow-y-auto">
                        <div class="prose max-w-none">
                            <h1>${featureName} Overview</h1>
                            <p class="text-gray-600">This article provides an overview of the ${featureName} feature in Windows App SDK 2.0.</p>
                            
                            <h2>What is ${featureName}?</h2>
                            <p>${featureName} enables developers to create more responsive and intuitive Windows applications. This feature provides a modern, efficient way to handle common development scenarios.</p>
                            
                            <h2>Key Benefits</h2>
                            <ul>
                                <li><strong>Performance</strong> - Optimized for speed and efficiency</li>
                                <li><strong>Ease of Use</strong> - Simple, intuitive API surface</li>
                                <li><strong>Reliability</strong> - Thoroughly tested and validated</li>
                            </ul>
                            
                            <h2>Prerequisites</h2>
                            <ul>
                                <li>Windows 11 version 22H2 or later</li>
                                <li>Windows App SDK 2.0</li>
                                <li>Visual Studio 2022 or later</li>
                            </ul>
                            
                            <h2>Next Steps</h2>
                            <p>To get started with ${featureName}, see the <a href="#">Getting Started Guide</a>.</p>
                            
                            <p class="text-sm text-gray-500 mt-4"><em>Note: This is AI-generated content following Windows editorial standards.</em></p>
                        </div>
                    </div>

                    <div class="flex gap-4 pt-6">
                        <button onclick="showValidation('${featureName}')" 
                                class="px-6 py-3 border border-gray-300 rounded-md font-medium hover:bg-gray-50 transition">
                            ← Back to Validation
                        </button>
                        <button onclick="createPR('${featureName}')" 
                                class="flex-1 bg-green-600 text-white px-6 py-3 rounded-md font-medium hover:bg-green-700 transition">
                            ✓ Create Pull Request
                        </button>
                    </div>
                </div>
            `;
        }

        function createPR(featureName) {
            const content = document.getElementById('content');
            updateStep('step-publish');
            
            content.innerHTML = `
                <div class="bg-white rounded-lg shadow p-8">
                    <div class="flex items-center mb-6">
                        <svg class="spinner w-8 h-8 text-blue-600 mr-3" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <h2 class="text-2xl font-bold text-gray-900">Creating pull request...</h2>
                    </div>
                    <p class="text-gray-600">Committing files and creating PR...</p>
                </div>
            `;

            setTimeout(() => showSuccess(featureName), 3000);
        }

        function showSuccess(featureName) {
            const content = document.getElementById('content');
            updateStep('step-publish', true);
            
            content.innerHTML = `
                <div class="bg-white rounded-lg shadow p-8">
                    <div class="text-center mb-8">
                        <svg class="w-20 h-20 text-green-500 mx-auto mb-4" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                        </svg>
                        <h2 class="text-3xl font-bold text-gray-900 mb-2">🎉 Pull Request Created!</h2>
                        <p class="text-gray-600">Your documentation is ready for review</p>

        }

        function updateStep(stepId, complete = false) {
            // Remove active from all
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active', 'complete'));
            
            // Mark completed steps
            const steps = ['step-intake', 'step-plan', 'step-generate', 'step-validate', 'step-publish'];
            const currentIndex = steps.indexOf(stepId);
            
            steps.forEach((step, index) => {
                const el = document.getElementById(step);
                if (index < currentIndex || (index === currentIndex && complete)) {
                    el.classList.add('complete');
                    el.querySelector('div').classList.remove('bg-gray-300');
                    el.querySelector('div').classList.add('bg-green-500');
                } else if (index === currentIndex) {
                    el.classList.add('active');
                    el.querySelector('div').classList.remove('bg-gray-300');
                    el.querySelector('div').classList.add('bg-blue-600');
                }
            });
        }
    </script>
